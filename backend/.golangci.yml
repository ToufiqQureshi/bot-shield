version: "2"
linters:
  default: standard
  enable:
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - gosec
    # Bugs that compile and pass tests but fail quietly in production:
    - errorlint     # == on a wrapped error silently stops matching
    - bodyclose     # unclosed HTTP response body leaks a pooled connection
    - nilerr        # checks err != nil, then returns nil anyway
    - sqlclosecheck # unclosed database rows hold a pool connection
  exclusions:
    rules:
      # Unchecked errors on test helpers (store.Add, w.Write, l.Close)
      # are noise, not bugs — the same class of error in production
      # code is not exempted.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
